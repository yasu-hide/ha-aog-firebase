version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # .pre-commit-config.yaml の rev (gitleaks) を更新する
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
